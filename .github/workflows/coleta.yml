name: Coleta oficial DODF

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/coleta.yml'
  workflow_dispatch:
    inputs:
      dodf_date:
        description: 'Data opcional YYYY-MM-DD'
        required: false
        type: string
  schedule:
    # GitHub Actions usa UTC; Brasília = UTC-3. Minutos deslocados para evitar pico :00.
    # 06:07-12:07 de Brasília em dias úteis.
    - cron: '7 9-15 * * 1-5'
    # Reconferência das 15:17 de Brasília.
    - cron: '17 18 * * 1-5'

permissions:
  contents: read

concurrency:
  group: dodf-coleta-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Definir data de Brasília
        shell: bash
        run: |
          echo "DODF_DATE=${{ github.event.inputs.dodf_date || '' }}" >> "$GITHUB_ENV"
          if [ -z "${{ github.event.inputs.dodf_date || '' }}" ]; then
            echo "DODF_DATE=$(TZ=America/Sao_Paulo date +%F)" >> "$GITHUB_ENV"
          fi

      - name: Restaurar controle diário anterior
        uses: actions/cache/restore@v4
        with:
          path: .state/
          key: dodf-estado-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            dodf-estado-${{ github.ref_name }}-

      - name: Coletar e validar com contingência
        id: verify
        shell: bash
        run: |
          ok=0
          for tentativa in 1 2 3; do
            echo "Tentativa $tentativa/3 — data $DODF_DATE"
            rm -rf "output/$DODF_DATE"
            mkdir -p "output/$DODF_DATE"
            if npm run collect && node src/verify-output.js; then
              ok=1
              break
            fi
            if [ "$tentativa" -lt 3 ]; then sleep $((tentativa * 45)); fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "COLETA AUTOMÁTICA NÃO VALIDADA — não foi possível obter o arquivo pelos canais acessíveis nesta execução"
            exit 1
          fi

      - name: Ler íntegra e gerar triagem jurídica SEDET/AJL
        id: triage
        run: node src/triage.js

      - name: Consolidar duplicidades por data+edição+seção+página+ato
        id: consolidate
        run: node src/consolidate-triage.js

      - name: Auditar independentemente atos de pessoal e nomes em todas as seções
        id: second_pass
        run: node src/audit-second-pass.js

      - name: Gerar boletim diário e delta sem presunção de auditoria humana
        id: delivery
        run: node src/delivery-gate.js

      - name: Salvar controle de duplicidades do dia
        if: steps.delivery.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .state/
          key: dodf-estado-${{ github.ref_name }}-${{ github.run_id }}

      - name: Publicar evidências da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dodf-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14

      - name: Resumo
        if: always()
        shell: bash
        run: |
          echo '## Coleta DODF' >> "$GITHUB_STEP_SUMMARY"
          find output -name status.txt -type f -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '## Controle de validação (não equivale a revisão jurídica)' >> "$GITHUB_STEP_SUMMARY"
          find output -name boletim-controle.md -type f -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
