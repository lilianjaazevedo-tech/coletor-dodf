name: Coleta oficial DODF

on:
  workflow_dispatch:
    inputs:
      dodf_date:
        description: 'Data opcional YYYY-MM-DD'
        required: false
        type: string
  schedule:
    # Brasília = UTC-3. Executa 6h,7h,8h,9h,10h,11h,12h em dias úteis.
    - cron: '0 9-15 * * 1-5'

permissions:
  contents: read

env:
  TZ: America/Sao_Paulo

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Definir data solicitada
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.dodf_date }}" ]; then
            echo "DODF_DATE=${{ github.event.inputs.dodf_date }}" >> "$GITHUB_ENV"
          fi

      - name: Coletar candidatos DODF
        id: collect
        continue-on-error: true
        run: npm run collect

      - name: Validar data exata no cabeçalho
        id: verify
        continue-on-error: true
        run: node src/verify-output.js

      - name: Ler íntegra e gerar triagem jurídica SEDET/AJL
        id: triage
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        run: node src/triage.js

      - name: Consolidar duplicidades por data+edição+seção+página+ato
        id: consolidate
        if: steps.verify.outcome == 'success' && steps.triage.outcome == 'success'
        continue-on-error: true
        run: node src/consolidate-triage.js

      - name: Publicar evidências da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dodf-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14

      - name: Resumo
        if: always()
        shell: bash
        run: |
          echo '## Coleta DODF' >> "$GITHUB_STEP_SUMMARY"
          find output -name status.txt -type f -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if find output -name relatorio-juridico.md -type f | grep -q .; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '## Triagem jurídica SEDET/AJL' >> "$GITHUB_STEP_SUMMARY"
            find output -name relatorio-juridico.md -type f -exec sed -n '1,100p' {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi

      - name: Marcar execução como falha técnica quando não houver PDF validado
        if: steps.verify.outcome == 'failure'
        run: exit 1

      - name: Marcar falha da triagem quando o PDF foi validado mas a leitura integral falhou
        if: steps.verify.outcome == 'success' && (steps.triage.outcome == 'failure' || steps.consolidate.outcome == 'failure')
        run: exit 1
